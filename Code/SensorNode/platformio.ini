; PlatformIO Project Configuration File
;
; Nodo sensor del bus CAN.
;
; Hay un entorno por placa + sensor. Todos comparten el mismo main.cpp;
; lo que cambia se elige con build_src_filter:
;   - el archivo del sensor      (sensor_temperature.cpp / sensor_wheel_speed.cpp)
;   - el backend del bus CAN     (can_mcp2515.cpp / can_twai.cpp)
; Sin ningun #ifdef dentro de las funciones. Los pines de cada placa
; estan en SensorNode.h.
;
; PRUEBA DE BANCO, con lo que hay. Los tres nodos van por MCP2515:
;
;   pio run -e rueda_nano          -t upload    Nano + inductivo LJ12A3   (rueda delantera)
;   pio run -e rueda_c3            -t upload    ESP32-C3 + infrarrojo     (rueda trasera)
;   pio run -e temperatura_nodemcu -t upload    NodeMCU + DHT11
;
; Antes de grabar: pio device list, y confirmar que la placa correcta
; esta enchufada. PlatformIO agarra cualquier puerto que encuentre.
;
; Agregar un sensor nuevo es: copiar uno de los archivos sensor_*.cpp,
; implementar las cuatro funciones que pide SensorNode.h, y sumar un
; entorno mas aca abajo. No hay que tocar main.cpp ni los can_*.cpp.

[platformio]
default_envs = rueda_nano

; Comun a todos los entornos
[env]
monitor_speed = 115200

; El nodo usa el mismo can_ids.h que la ECU en vez de una copia. Si cada
; proyecto tuviera el suyo, tarde o temprano divergirian y el dato
; llegaria mal sin que nada avise, que es exactamente lo que el mapa de
; IDs existe para evitar.
build_flags = -I../ECU/include

; ---------------------------------------------------------------------
; Arduino Nano: sensor inductivo, rueda delantera
; ---------------------------------------------------------------------
; Los Nano del equipo tienen el bootloader viejo (57600 baud). Si con
; un Nano nuevo la grabacion falla con "not in sync", cambiar board a
; nanoatmega328new.
[env:rueda_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = arduino
build_src_filter = +<*> -<sensor_temperature.cpp> -<can_twai.cpp>
lib_deps =
    autowp/autowp-mcp2515

; ---------------------------------------------------------------------
; ESP32-C3 Super Mini: sensor infrarrojo, rueda trasera
; ---------------------------------------------------------------------
[env:rueda_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<*> -<sensor_temperature.cpp> -<can_twai.cpp>
build_flags =
    ${env.build_flags}
    -D WHEEL_CAN_IDENTIFIER=CAN_ID_RPM_REAR
    ; El Super Mini solo tiene el USB nativo del chip: Serial tiene que
    ; salir por ahi, y el board de PlatformIO por defecto lo manda al UART.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    autowp/autowp-mcp2515

; ---------------------------------------------------------------------
; NodeMCU V3 LoLin (ESP8266): DHT11, temperatura de prueba
; ---------------------------------------------------------------------
[env:temperatura_nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_src_filter = +<*> -<sensor_wheel_speed.cpp> -<can_twai.cpp>
lib_deps =
    autowp/autowp-mcp2515
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; ---------------------------------------------------------------------
; Alternativas que compilan pero no se usan en esta prueba
; ---------------------------------------------------------------------
; DHT11 en el segundo Nano, por si el NodeMCU da problemas.
[env:temperatura_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_protocol = arduino
build_src_filter = +<*> -<sensor_wheel_speed.cpp> -<can_twai.cpp>
lib_deps =
    autowp/autowp-mcp2515
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; ESP32-C3 con su CAN interno, para cuando haya un transceiver
; SN65HVD230. Es el backend definitivo del auto.
[env:rueda_c3_twai]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<*> -<sensor_temperature.cpp> -<can_mcp2515.cpp>
build_flags =
    ${env.build_flags}
    -D WHEEL_CAN_IDENTIFIER=CAN_ID_RPM_REAR
