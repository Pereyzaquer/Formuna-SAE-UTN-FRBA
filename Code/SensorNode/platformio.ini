; PlatformIO Project Configuration File
;
; Nodo sensor del bus CAN, sobre ESP32-C3.
;
; Hay un entorno por sensor. Los dos comparten todo el codigo salvo el
; archivo que lee el sensor, que se elige con build_src_filter: asi no
; hace falta ni un solo #ifdef dentro de las funciones.
;
; Para grabar cada placa:
;   pio run -e temperatura -t upload
;   pio run -e rueda       -t upload
;
; Agregar un sensor nuevo es: copiar uno de los archivos sensor_*.cpp,
; implementar las cuatro funciones que pide SensorNode.h, y sumar un
; entorno mas aca abajo. No hay que tocar main.cpp ni can.cpp.

[platformio]
default_envs = rueda

; Opciones comunes a todos los nodos
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

; El nodo usa el mismo can_ids.h que la ECU en vez de una copia. Si cada
; proyecto tuviera el suyo, tarde o temprano divergirian y el dato
; llegaria mal sin que nada avise, que es exactamente lo que el mapa de
; IDs existe para evitar.
build_flags = -I../ECU/include

[env:temperatura]
build_src_filter = +<*> -<sensor_wheel_speed.cpp>
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; Velocidad de giro con el modulo infrarrojo LM393, contando pulsos.
[env:rueda]
build_src_filter = +<*> -<sensor_temperature.cpp>
