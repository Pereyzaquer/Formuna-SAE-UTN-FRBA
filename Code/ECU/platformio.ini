; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Entornos:
;   usb  -> se sube por cable. CAN por modulo MCP2515 (banco).
;   ota  -> se sube por wifi. CAN por modulo MCP2515 (banco).
;   twai -> se sube por cable. CAN nativo del ESP32 (auto).
;
; Los dos primeros son el mismo firmware con distinta forma de subirlo.
; El tercero cambia la capa de hardware del bus: ver can_twai.cpp y
; can_mcp2515.cpp. Se compila uno u otro con build_src_filter, sin
; ningun #ifdef en el codigo.
;
; El OTA solo funciona si la placa ya tiene un firmware con OTA andando.

[platformio]
default_envs = usb

; Opciones comunes a los dos entornos
[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200

; Por defecto se compila el backend MCP2515: es el hardware que hay para
; la prueba de banco. El entorno twai lo pisa mas abajo.
build_src_filter = +<*> -<can_twai.cpp>

lib_deps =
    adafruit/Adafruit NeoPixel
    autowp/autowp-mcp2515

lib_ignore =
    Seeed Arduino rpcUnified

[env:usb]
upload_protocol = esptool

; OJO con el autodetect del puerto. Si la ESP32-S3 no esta enchufada,
; PlatformIO agarra cualquier otro puerto serie que encuentre y le
; intenta grabar este firmware: ya paso una vez con un Arduino Leonardo
; conectado a la misma maquina. No llego a escribir nada porque esptool
; no pudo sincronizar, pero no conviene depender de esa suerte.
;
; Antes de grabar, verificar que la placa este en la lista:
;   pio device list
; La ESP32-S3 se reconoce por su identificador USB VID:PID=303A:1001.
; Si hay mas de una placa conectada, fijar el puerto aca abajo.
;upload_port = COM3

[env:ota]
upload_protocol = espota
; IP fija del softAP, verificada por serial. Se usa la IP y no
; esp32-ota.local porque el mDNS sobre el AP propio no siempre resuelve
; desde Windows.
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=utnsae2026$

; CAN nativo del ESP32, para cuando haya transceiver SN65HVD230. Es el
; backend definitivo del auto; el MCP2515 es solo para el banco.
[env:twai]
upload_protocol = esptool
build_src_filter = +<*> -<can_mcp2515.cpp>
