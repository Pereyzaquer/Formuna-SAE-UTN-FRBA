; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Hay dos entornos con el mismo codigo, solo cambia como se sube:
;   usb  -> cable, por esptool. Es el que hay que usar la primera vez
;           y cada vez que el OTA quede inutilizable.
;   ota  -> por wifi, contra el AP que levanta la propia ECU.
;           Solo funciona si la placa ya tiene un firmware con OTA
;           andando y esta en BOOT o CONFIG (despues de CAR_READY el
;           wifi se apaga hasta el proximo reset).

[platformio]
default_envs = usb

; Opciones comunes a los dos entornos
[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel

lib_ignore =
    Seeed Arduino rpcUnified

[env:usb]
upload_protocol = esptool
; Descomentar y ajustar si el autodetect agarra el puerto equivocado.
;upload_port = COM3

[env:ota]
upload_protocol = espota
; IP fija del softAP, verificada por serial. Se usa la IP y no
; esp32-ota.local porque el mDNS sobre el AP propio no siempre resuelve
; desde Windows.
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=utnsae2026$
